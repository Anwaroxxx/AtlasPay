services:
  # AtlasPay — single Inertia app (Laravel API + React web served by Laravel).
  # Mobile lives OUTSIDE this repo (../AtlasPayMobile) and talks to this
  # same backend over HTTP + Sanctum tokens, sharing the same database.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
    networks:
      - atlaspay

networks:
  atlaspay:
    driver: bridge
